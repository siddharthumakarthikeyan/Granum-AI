name: release-linux
# Builds the self-contained Linux app (one AppImage) and attaches it to the GitHub release.
# Runs for every push or merge to main, and for every v* tag. A build of main is kept as the
# "main-build" pre-release, replacing the one before:
#   https://github.com/siddharthumakarthikeyan/Granum-AI/releases/tag/main-build
# The website offers a build only once it is approved with the publish-download workflow.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# A newer push to main replaces a build of an older one that is still running.
concurrency:
  group: release-linux-${{ github.ref }}
  cancel-in-progress: true

# Creating the GitHub release and uploading the AppImage to it needs write access to the
# repository contents; workflows get read-only access unless they ask for more.
permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  appimage:
    needs: checks
    env:
      GRANUM_RELEASE_BUILD: "1"
    # The oldest supported Ubuntu, so the app runs on it and everything newer.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Desktop libraries
        # The app uses the desktop's own graphics, font and display libraries (they belong to the
        # GPU driver and the session), so they are not bundled. Build machines are servers without
        # them; install a desktop's set so the build can check that the window imports.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils \
            libegl1 libgl1 libopengl0 libgbm1 libdrm2 \
            libx11-6 libx11-xcb1 libxcomposite1 libxdamage1 libxext6 libxfixes3 libxi6 libxrandr2 libxrender1 \
            libxtst6 libxkbfile1 libxshmfence1 libxkbcommon0 \
            libxcb1 libxcb-dri3-0 libxcb-glx0 libxcb-randr0 libxcb-render0 libxcb-shape0 libxcb-shm0 libxcb-sync1 \
            libxcb-util1 libxcb-xfixes0 \
            libwayland-client0 libwayland-cursor0 libwayland-egl1 \
            libfontconfig1 libfreetype6 libharfbuzz0b libdbus-1-3 libglib2.0-0 libnss3 libnspr4 libasound2 libudev1 \
            libgssapi-krb5-2 libbrotli1 libexpat1 libzstd1 libatomic1 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xkb1 libxkbcommon-x11-0
      - name: Build the AppImage
        run: packaging/linux/build-appimage.sh
      - uses: actions/upload-artifact@v5
        with:
          name: Granum-linux-x86_64
          path: |
            dist/*.AppImage
            dist/*.AppImage.manifest.json
            dist/*.AppImage.sha256
          compression-level: 0
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/*.AppImage
            dist/*.AppImage.manifest.json
            dist/*.AppImage.sha256
      - name: Keep as the build of main
        # The "main-build" pre-release always holds the newest build of main: its tag moves to
        # this commit and this platform's files from the build before are replaced.
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f main-build "$GITHUB_SHA"
          git push -f origin refs/tags/main-build
          notes="Built from commit $GITHUB_SHA. Replaced on every push to main; not the website's download until approved with the publish-download workflow."
          gh release view main-build >/dev/null 2>&1 \
            || gh release create main-build --prerelease --title "Build of main" --notes "$notes" \
            || gh release view main-build >/dev/null
          gh release edit main-build --prerelease --title "Build of main" --notes "$notes"
          gh release view main-build --json assets --jq '.assets[].name' | { grep -E '\.AppImage(\.|$)' || true; } | while read -r name; do
            gh release delete-asset main-build "$name" -y
          done
          gh release upload main-build dist/*.AppImage dist/*.AppImage.manifest.json dist/*.AppImage.sha256 --clobber
