name: release-windows
# Builds the self-contained Windows app (one Setup.exe) and attaches it to the GitHub release.
# Runs for every push or merge to main, and for every v* tag. A build of main is kept as the
# "main-build" pre-release, replacing the one before:
#   https://github.com/siddharthumakarthikeyan/Granum-AI/releases/tag/main-build
# The website offers a build only once it is approved with the publish-download workflow.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# A newer push to main replaces a build of an older one that is still running.
concurrency:
  group: release-windows-${{ github.ref }}
  cancel-in-progress: true

# Creating the GitHub release and uploading the installer to it needs write access to the
# repository contents; workflows get read-only access unless they ask for more.
permissions:
  contents: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  installer:
    needs: checks
    env:
      GRANUM_RELEASE_BUILD: "1"
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Inno Setup
        # Preinstalled on GitHub's Windows images; install it if an image ever drops it.
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build the installer
        shell: pwsh
        run: packaging\windows\build-installer.ps1
      - name: Verify fresh install and uninstall
        shell: pwsh
        run: |
          $target = Join-Path $env:RUNNER_TEMP "Granum-install-smoke"
          $setup = (Get-ChildItem dist\*-Setup.exe | Select-Object -First 1).FullName
          $installed = Start-Process $setup -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=`"$target`"" -Wait -PassThru
          if ($installed.ExitCode -ne 0) { throw "Installer failed: $($installed.ExitCode)" }
          & "$target\python\python.exe" -I tools\smoke_package.py
          if ($LASTEXITCODE -ne 0) { throw "Installed package smoke test failed" }
          $removed = Start-Process "$target\unins000.exe" -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -Wait -PassThru
          if ($removed.ExitCode -ne 0) { throw "Uninstaller failed: $($removed.ExitCode)" }
      - uses: actions/upload-artifact@v5
        with:
          name: Granum-windows-x64
          path: |
            dist/*-Setup.exe
            dist/*-Setup.exe.manifest.json
            dist/*-Setup.exe.sha256
          compression-level: 0
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            dist/*-Setup.exe
            dist/*-Setup.exe.manifest.json
            dist/*-Setup.exe.sha256
      - name: Keep as the build of main
        # The "main-build" pre-release always holds the newest build of main: its tag moves to
        # this commit and this platform's files from the build before are replaced.
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag -f main-build "$GITHUB_SHA"
          git push -f origin refs/tags/main-build
          notes="Built from commit $GITHUB_SHA. Replaced on every push to main; not the website's download until approved with the publish-download workflow."
          gh release view main-build >/dev/null 2>&1 \
            || gh release create main-build --prerelease --title "Build of main" --notes "$notes" \
            || gh release view main-build >/dev/null
          gh release edit main-build --prerelease --title "Build of main" --notes "$notes"
          gh release view main-build --json assets --jq '.assets[].name' | { grep -E -- '-Setup\.exe(\.|$)' || true; } | while read -r name; do
            gh release delete-asset main-build "$name" -y
          done
          gh release upload main-build dist/*-Setup.exe dist/*-Setup.exe.manifest.json dist/*-Setup.exe.sha256 --clobber
