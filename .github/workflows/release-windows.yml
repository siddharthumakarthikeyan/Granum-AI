name: release-windows
# Builds the self-contained Windows app (one Setup.exe) and attaches it to the GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Creating the GitHub release and uploading the installer to it needs write access to the
# repository contents; workflows get read-only access unless they ask for more.
permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Inno Setup
        # Preinstalled on GitHub's Windows images; install it if an image ever drops it.
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Build the installer
        shell: pwsh
        run: packaging\windows\build-installer.ps1
      - uses: actions/upload-artifact@v5
        with:
          name: Granum-windows-x64
          path: dist/*-Setup.exe
          compression-level: 0
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*-Setup.exe
