name: ci
on:
  push:
  pull_request:
  workflow_call:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,pandas,images,service]"
      - run: ruff check src tests hatch_build.py build_provenance.py tools/benchmark_workflows.py tools/release_manifest.py tools/smoke_package.py tools/approve_release.py
      - run: pytest -q
  test-windows:
    # The Windows app runs Python in UTF-8 mode (-X utf8); tests run the same way.
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,pandas,images,service]"
      - run: pytest -q
  website:
    # The public site and licence server in website/, which Vercel deploys from main.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest httpx markdown
        working-directory: website
      - run: python tools/docs.py --check
        working-directory: website
      - run: pytest -q tests
        working-directory: website
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run test
        working-directory: web
      - run: npm run typecheck:e2e
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: npm audit --audit-level=moderate
        working-directory: web
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,images,service]"
      - run: npx playwright install --with-deps chromium
        working-directory: web
      - run: npx playwright test --reporter=html
        working-directory: web
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: browser-qualification
          path: |
            web/playwright-report/
            web/test-results/
